<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner Móvil de Asistencia</title>
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-dark text-white">
    <div class="container py-4">
        <div class="text-center mb-3">
            <h4><i class="fas fa-qrcode text-info"></i> Terminal Móvil de Escaneo</h4>
            <p class="small text-light mb-2">Apunta la cámara al código QR del alumno</p>
        </div>

        <div class="card bg-white text-dark shadow-lg mx-auto" style="max-width: 450px;">
            <div class="card-body text-center">
                <div id="reader" style="width: 100%;"></div>
                <div id="resultadoMovil" class="mt-3 d-none text-left"></div>
            </div>
        </div>
    </div>

    <script>
        const HOST_BACKEND = window.location.hostname || "localhost";
        const API_BASE = `http://${HOST_BACKEND}:8080/api`;
        let pausado = false;

        async function onScanSuccess(decodedText) {
            if (pausado) return;
            pausado = true;
            setTimeout(() => { pausado = false; }, 3000);

            const box = document.getElementById("resultadoMovil");
            try {
                const res = await fetch(`${API_BASE}/asistencias/escanear`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ codigoQr: decodedText.trim() })
                });
                const data = await res.json();

                if (res.ok) {
                    const urlQr = `${API_BASE}/qr/${decodedText.trim()}`;
                    box.innerHTML = `
                        <div class="alert alert-success mb-0">
                            <h6 class="font-weight-bold mb-1">✅ ${data.mensaje}</h6>
                            <div><strong>Alumno:</strong> ${data.alumno}</div>
                            <div><strong>N° Control:</strong> ${data.numeroControl} | <strong>Grupo:</strong> ${data.grupo}</div>
                            <div><strong>Hora:</strong> ${data.hora}</div>
                            <a href="${urlQr}" target="_blank" class="btn btn-sm btn-primary mt-2 btn-block">Abrir Enlace QR</a>
                        </div>`;
                } else {
                    box.innerHTML = `<div class="alert alert-danger mb-0"><strong>⚠️ ${data.mensaje}</strong></div>`;
                }
                box.classList.remove("d-none");
            } catch (err) {
                box.innerHTML = `<div class="alert alert-danger mb-0">Error conectando a ${API_BASE}</div>`;
                box.classList.remove("d-none");
            }
        }

        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 230 });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
