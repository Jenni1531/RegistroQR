<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas de Inasistencia - Control QR</title>
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">
    <div id="wrapper">
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion">
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="admin.html">
                <div class="sidebar-brand-icon"><i class="fas fa-qrcode"></i></div>
                <div class="sidebar-brand-text mx-3">Control QR</div>
            </a>
            <hr class="sidebar-divider my-0">
            <li class="nav-item"><a class="nav-link" href="admin.html"><i class="fas fa-fw fa-tachometer-alt"></i><span>Panel y Escáner</span></a></li>
            <li class="nav-item"><a class="nav-link" href="registro-alumnos.html"><i class="fas fa-fw fa-user-plus"></i><span>Registro de Alumnos</span></a></li>
            <li class="nav-item active"><a class="nav-link" href="alertas.html"><i class="fas fa-fw fa-exclamation-triangle"></i><span>Alertas (+3 Faltas)</span></a></li>
            <li class="nav-item"><a class="nav-link" href="escaner-movil.html" target="_blank"><i class="fas fa-fw fa-mobile-alt"></i><span>Modo Escáner Celular</span></a></li>
            <hr class="sidebar-divider">
            <div class="text-center px-3">
                <button onclick="cerrarSesion()" class="btn btn-light btn-sm btn-block font-weight-bold text-primary">Cerrar Sesión</button>
            </div>
        </ul>

        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content" class="p-4">
                <h1 class="h3 mb-4 text-gray-800">Monitor de Alertas por Inasistencia</h1>
                <div class="card shadow border-left-danger">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-danger"><i class="fas fa-bell"></i> Alumnos con 3 o más Faltas Acumuladas</h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered">
                                <thead class="thead-light">
                                    <tr>
                                        <th>N° Control</th>
                                        <th>Alumno</th>
                                        <th>Grupo</th>
                                        <th>Total Faltas</th>
                                        <th>Fechas Exactas en que no Asistió</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaAlertas"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = `http://${window.location.hostname}:8080/api`;
        const sesion = JSON.parse(localStorage.getItem("usuarioSesion"));
        if (!sesion || sesion.rol !== "ADMIN") window.location.href = "login.html";

        async function cargarAlertas() {
            const res = await fetch(`${API_BASE}/asistencias/dashboard`);
            const data = await res.json();
            const tbody = document.getElementById("tablaAlertas");
            tbody.innerHTML = data.alertasFaltas.length === 0
                ? `<tr><td colspan="5" class="text-center text-muted">No hay alumnos con 3 o más faltas actualmente.</td></tr>`
                : data.alertasFaltas.map(al => `
                    <tr class="table-danger">
                        <td>${al.numeroControl}</td>
                        <td><strong>${al.nombreCompleto}</strong></td>
                        <td>${al.grupo}</td>
                        <td><span class="badge badge-danger">${al.totalFaltas} faltas</span></td>
                        <td>${al.fechasFaltadas.join(", ")}</td>
                    </tr>`).join("");
        }

        function cerrarSesion() {
            localStorage.removeItem("usuarioSesion");
            window.location.href = "login.html";
        }

        cargarAlertas();
    </script>
</body>
</html>
